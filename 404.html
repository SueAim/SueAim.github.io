<script>
// GitHub Pages addresses are case-sensitive. Send other spellings of a known folder
// (block1, BLOCK1, block-1, "Block 1") to the real one before showing this page.
(function(){
  var known = { block1: '/Block1/', block6: '/Block6/' };
  var parts = location.pathname.split('/');
  var first = parts[1] || '';
  try { first = decodeURIComponent(first); } catch(e) {}
  var key = first.toLowerCase().replace(/[\s_\-]+/g, '');
  var target = known[key];
  if (target && '/' + parts[1] + '/' !== target) {
    location.replace(target + parts.slice(2).join('/') + location.search + location.hash);
  }
})();
</script>
